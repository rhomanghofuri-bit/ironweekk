<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="description" content="Jadwal latihan gym mingguan dengan animasi contoh gerakan">
<title>Jadwal Gym</title>
<style>
:root{
  --bg:#0f1115;--panel:#171a21;--panel2:#1f232c;--line:#2a2f3a;
  --text:#eef1f5;--mute:#8b93a3;--acc:#ff6b2c;--acc-soft:rgba(255,107,44,.14);
  --ok:#3ecf8e;--ok-soft:rgba(62,207,142,.15);--danger:#ff5d5d;--blue:#5aa9ff;--blue-soft:rgba(90,169,255,.14);--r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.4;cursor:default}
.logo{font-weight:800;font-size:18px;letter-spacing:.2px}
.logo span{color:var(--acc)}
.dbstat{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute);flex:none}
.dot.ok{background:var(--ok)}.dot.err{background:var(--danger)}.dot.load{background:var(--acc);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}

.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:14px 0 10px}
.chip-day{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px 2px;text-align:center;font-size:11px;color:var(--mute);line-height:1.25;min-width:0}
.chip-day b{display:block;font-size:13px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 3px}
.chip-day.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chip-day.on b{color:#fff}
.chip-day.today:not(.on){border-color:var(--acc)}
.chip-day.t-rest b{color:var(--mute)}
.chip-day.t-activity b{color:var(--blue)}
.chip-day.on.t-rest b,.chip-day.on.t-activity b{color:#fff}

h2{font-size:20px;margin:8px 0 2px}
.sub{color:var(--mute);font-size:13px;margin:0 0 12px}
.progress{height:6px;background:var(--panel2);border-radius:9px;overflow:hidden;margin:4px 0 16px}
.progress i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:12px;transition:border-color .15s,background .15s}
.card.selected,.exrow.selected{border-color:var(--danger);background:#1d1517}
.ex-head{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.ex-head .media{width:var(--thumb,112px);flex:none}
.ex-info{min-width:0;flex:1}
.ex-num{font-size:11px;color:var(--acc);font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.ex-name{font-weight:700;font-size:15.5px;margin:1px 0 1px}
.ex-alias{color:var(--mute);font-size:13px}
.ex-meta{margin-top:6px;font-size:13px}
.ex-meta b{color:var(--acc)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tag{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--panel2);color:var(--mute);border:1px solid var(--line)}
.tag.p{background:var(--acc-soft);color:#ffb08a;border-color:transparent}
.note{font-size:13px;color:#cfd5df;background:var(--panel2);border-radius:8px;padding:6px 9px;margin-top:10px}
.sets{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.set{min-width:58px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-size:12.5px;text-align:center}
.set.done{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:700}
.warn{border-color:#5a4520;background:#221c12}
.warn .ex-name{color:#ffcf7a}

/* keterangan & aktivitas */
.desc-card{display:flex;gap:10px;align-items:flex-start;background:var(--blue-soft);border-color:transparent;color:#d8e8ff;font-size:14px;white-space:pre-line}
.desc-card .ic{font-size:18px;line-height:1.2}
.daybig{display:flex;gap:14px;align-items:center;padding:18px}
.daybig .ic{font-size:40px;line-height:1}
.daybig .t{font-weight:800;font-size:18px}
.daybig .d{color:#cfd5df;font-size:14px;white-space:pre-line;margin-top:4px}
.daybig .d.empty{color:var(--mute);font-style:italic}
.daybig.t-activity{border-color:#264766;background:#121b26}
.daybig .grow{flex:1;min-width:0}
.btn.done-ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:700}

.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.seg button{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 6px;font-size:13px}
.seg button.on{border-color:var(--acc);background:var(--acc-soft);color:#ffc3a6;font-weight:700}
.cfg-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag-btn{font-size:12.5px;padding:5px 11px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);color:#cfd5df}
.tag-btn.on{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}

/* animasi GIF */
.media{position:relative;background:#fff;aspect-ratio:1/1;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.media img{width:100%;height:100%;object-fit:contain;display:block}
.media.big{width:min(100%,380px);margin:0 auto;border-radius:16px}
.media .play{position:absolute;right:6px;bottom:6px;background:rgba(15,17,21,.75);color:#fff;font-size:10px;border-radius:20px;padding:2px 7px;z-index:2}
.media.empty,.media.err{background:var(--panel2);color:var(--mute);font-size:12px;text-align:center;padding:6px}
.media.err img,.media.err .play{display:none}
.media.err::after{content:"Animasi gagal dimuat (cek internet)"}

.btn{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:8px 12px;font-size:13.5px}
.btn:hover:not(:disabled){border-color:#3b4250}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.btn.danger{color:var(--danger)}
.btn.danger-fill{background:var(--danger);border-color:var(--danger);color:#fff;font-weight:700}
.btn.block{width:100%;padding:12px}
.btn.sm{padding:5px 9px;font-size:12.5px}
input[type=text],input[type=number],input[type=search],select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;outline:none}
textarea{resize:vertical;min-height:70px;line-height:1.4}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
label.f{display:block;font-size:11.5px;color:var(--mute);margin-bottom:4px}
.row{display:flex;gap:8px;align-items:center}
.grid3{display:grid;grid-template-columns:70px 1fr 90px;gap:8px;margin-top:10px}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.section-t{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--mute);margin:22px 0 8px}

.selbox{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--mute);cursor:pointer;user-select:none}
.selbox input{width:20px;height:20px;accent-color:var(--danger);margin:0;cursor:pointer}
.card.selected .selbox,.exrow.selected .selbox{color:var(--danger)}
.card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.selbar{position:sticky;z-index:15;background:var(--bg);padding:8px 0;display:flex;align-items:center;gap:10px;margin:14px 0 6px;border-bottom:1px solid var(--line)}
.selbar .n{font-size:13px;color:var(--mute);margin-left:auto}
.selbar.active .n{color:var(--danger);font-weight:700}

.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 12px}
.filters .full{grid-column:1/-1}
.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.libitem{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.libitem:hover{border-color:#3b4250}
.libitem .media{border-radius:0}
.libitem .t{padding:8px 9px 10px;font-size:13px;font-weight:600;line-height:1.3}
.libitem .t small{display:block;font-weight:400;color:var(--mute);font-size:11.5px;margin-top:2px}
.count{font-size:12.5px;color:var(--mute);margin-bottom:8px}

.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:none;justify-content:center}
.modal.open{display:flex}
#m2{z-index:60}
.sheet{background:var(--bg);border:1px solid var(--line);width:100%;overflow:auto;padding:0 14px 24px}
.mhead{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:10px;padding:14px 0 10px;z-index:3}
.mhead b{font-size:16px;flex:1}
.x{background:var(--panel2);border:1px solid var(--line);width:34px;height:34px;border-radius:50%;font-size:16px;flex:none}
ol.steps{padding-left:20px;margin:6px 0;color:#d6dbe4;font-size:14px}
ol.steps li{margin-bottom:6px}

#timer{position:fixed;z-index:40;display:none}
#timer.show{display:block}
#timer .bar{background:#22160f;border:1px solid var(--acc);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#timer .big{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--acc);min-width:70px}
#timer .lbl{flex:1;font-size:12.5px;color:#e9c9b5;min-width:0}
#timer.done .bar{border-color:var(--ok);background:#0f2219}
#timer.done .big{color:var(--ok)}

#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#fff;color:#111;padding:9px 14px;border-radius:10px;font-size:13.5px;z-index:90;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
.empty-state{text-align:center;color:var(--mute);padding:30px 10px}
.banner{background:#2a1517;border:1px solid #5b2a2e;color:#ffc9c9;border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:12px}
footer{color:var(--mute);font-size:11.5px;text-align:center;margin:26px 0 8px}
footer a{color:var(--mute)}

/* ===== HP & tablet (< 1024px) ===== */
@media (max-width:1023.98px){
main{max-width:760px;margin:0 auto;padding:0 14px}
aside.side{display:none}
body{padding-bottom:calc(90px + env(safe-area-inset-bottom))}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;z-index:20;background:rgba(15,17,21,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:10px;height:56px}
header .dbstat{margin-left:auto}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.bottom .wrap{display:grid;grid-template-columns:repeat(3,1fr)}
nav.bottom button{background:none;border:0;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mute);font-size:12px}
nav.bottom button svg{width:22px;height:22px}
nav.bottom button.on{color:var(--acc)}
.selbar{top:56px}
.modal{align-items:flex-end}
.sheet{max-width:760px;max-height:92vh;border-radius:18px 18px 0 0}
#timer{left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom))}
#timer .in{max-width:760px;margin:0 auto;padding:0 14px}
.seg button{font-size:12px;padding:9px 4px}

}
@media (max-width:420px){ .cfg-grid{grid-template-columns:1fr} }
@media (min-width:800px) and (max-width:1023.98px){ .modal{align-items:center} .sheet{border-radius:18px;max-height:88vh} }
/* ===== Laptop / PC (>= 1024px) ===== */
@media (min-width:1024px){
body{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#2a2f3a;border-radius:10px}::-webkit-scrollbar-track{background:transparent}

/* sidebar */
aside.side{position:sticky;top:0;height:100vh;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px}
aside.side .logo{font-size:21px;padding:0 8px 22px}
nav.sidenav{display:flex;flex-direction:column;gap:4px}
nav.sidenav button{display:flex;align-items:center;gap:11px;background:none;border:0;border-radius:10px;padding:10px 12px;color:#b9c0cc;font-size:14.5px;text-align:left}
nav.sidenav button svg{width:20px;height:20px;flex:none}
nav.sidenav button:hover{background:var(--panel2)}
nav.sidenav button.on{background:var(--acc-soft);color:#ffb08a;font-weight:700}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.side-foot .section-t{margin:10px 6px 4px}
.side-foot .btn{text-align:left;width:100%}
.side-foot .dbstat{padding:10px 6px 0;border-top:1px solid var(--line);margin-top:8px;flex-wrap:wrap}

main{padding:24px 32px 40px;min-width:0}
.wrap-d{max-width:1360px;margin:0 auto}
.page-head{display:flex;align-items:flex-end;gap:16px;margin-bottom:6px}
.page-head h1{font-size:26px;margin:0}
.page-head .sub{margin:0 0 4px}
h2{font-size:24px;margin:10px 0 4px}

.days{gap:10px;margin:16px 0 14px}
.chip-day{padding:10px 4px;font-size:12px;border-radius:12px}
.chip-day b{font-size:15px}
.chip-day:hover:not(.on){border-color:#3b4250}

/* latihan: grid kartu */
.exlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:14px}
.exlist .card{margin:0}
.exlist{--thumb:150px}
.daybig{max-width:760px}

/* atur jadwal: papan minggu */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin:16px 0 18px}
.wk{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 11px;cursor:pointer;min-height:150px;display:flex;flex-direction:column;transition:border-color .15s}
.wk:hover{border-color:#3b4250}
.wk.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.wk-h{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mute)}
.wk-h em{font-style:normal;font-size:10.5px;color:var(--acc);border:1px solid var(--acc);border-radius:20px;padding:0 6px}
.wk-l{font-weight:700;font-size:14.5px;margin:3px 0 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wk.t-activity .wk-l{color:var(--blue)}
.wk.t-rest .wk-l{color:var(--mute)}
.wk ul{list-style:none;margin:0;padding:0;font-size:12px;color:#c3c9d4}
.wk li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:2px 0;border-top:1px dashed #262b35}
.wk li.more{color:var(--mute)}
.wk p{margin:0;font-size:12px;color:#aeb6c3;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}

.split{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
.daycfg{padding:16px}
.daycfg .cfg-grid{grid-template-columns:1.2fr 1fr}
.selbar{top:0}

/* tabel gerakan */
.exrow{display:grid;grid-template-columns:22px 18px 70px minmax(140px,1fr) 56px 80px 72px 106px;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.exrow .num{font-size:12px;color:var(--acc);font-weight:700;text-align:center}
.exrow .thumb{cursor:pointer}
.exrow .thumb .media{border-radius:9px}
.exrow .nm{min-width:0}
.exrow .nm .ex-name{font-size:14.5px;cursor:pointer}
.exrow .nm input{margin-top:6px;padding:6px 9px;font-size:13px}
.exrow input[type=number],.exrow input[type=text]{padding:7px 9px}
.exrow .acts{display:flex;gap:4px}
.exrow.warn{border-color:#5a4520;background:#221c12}
.exhead{display:grid;grid-template-columns:22px 18px 70px minmax(140px,1fr) 56px 80px 72px 106px;gap:10px;padding:0 12px 6px;font-size:11.5px;color:var(--mute)}

/* panel pustaka samping */
.libpanel{position:sticky;top:24px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;max-height:calc(100vh - 48px);display:flex;flex-direction:column}
.lp-h{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.lp-h b{font-size:15px}
.lp-h .sub{margin:0}
.libpanel .filters{margin:8px 0 10px}
.lp-on{display:flex;flex-direction:column;min-height:0;flex:1}
#sideRes{overflow:auto;min-height:0;flex:1;margin-right:-6px;padding-right:6px}
.lp-off{display:none;color:var(--mute);font-size:13.5px;padding:20px 4px;text-align:center}
.libpanel.disabled .lp-on{display:none}
.libpanel.disabled .lp-off{display:block}
.lrow{display:flex;align-items:center;gap:10px;padding:6px;border-radius:10px;cursor:pointer}
.lrow:hover{background:var(--panel2)}
.lrow .media{width:56px;flex:none;border-radius:8px}
.lrow .media .play{display:none}
.lr-t{flex:1;min-width:0;font-size:13px;font-weight:600;line-height:1.3}
.lr-t small{display:block;font-weight:400;color:var(--mute);font-size:11.5px}
.lrow .btn{width:32px;height:32px;padding:0;font-size:18px;flex:none}

/* pustaka */
.libgrid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.filters.wide{grid-template-columns:2fr 1fr 1fr;max-width:900px}
.filters.wide .full{grid-column:auto}

/* modal */
.modal{align-items:center}
.sheet{max-width:960px;max-height:88vh;border-radius:18px;padding:0 24px 24px}
.detail-grid{display:grid;grid-template-columns:380px 1fr;gap:24px;align-items:start}
.detail-grid .media.big{width:100%}

#timer{right:24px;bottom:24px;width:420px}
#toast{top:24px}
footer{text-align:left}
header,nav.bottom{display:none}

}
@media (min-width:1024px) and (max-width:1439.98px){ .split{grid-template-columns:minmax(0,1fr) 310px} main{padding:22px 22px 40px} }
@media (min-width:1024px) and (max-width:1299.98px){
  .split{grid-template-columns:1fr} .libpanel{position:static;max-height:none} #sideRes{max-height:460px}
  .week{gap:6px} .wk{padding:8px;min-height:130px}
}

</style>
</head>
<body>
<header><div class="wrap"><div class="logo">Jadwal<span>Gym</span></div><div class="dbstat"><i class="dot load"></i><span>Memuat database…</span></div></div></header>
<aside class="side">
  <div class="logo">Jadwal<span>Gym</span></div>
  <nav class="sidenav"><button data-act="tab" data-tab="latihan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Latihan Hari Ini</button><button data-act="tab" data-tab="atur"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M8 15h3"/></svg>Atur Jadwal</button><button data-act="tab" data-tab="pustaka"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></svg>Pustaka Gerakan</button></nav>
  <div class="side-foot">
    <div class="section-t">Data</div>
    <button class="btn" data-act="export">⬇ Ekspor jadwal</button>
    <button class="btn" data-act="import">⬆ Impor jadwal</button>
    <button class="btn" data-act="reloadDB">↻ Perbarui database</button>
    <button class="btn danger" data-act="reset">Reset ke template PPL</button>
    <div class="dbstat"><i class="dot load"></i><span>Memuat database…</span></div>
  </div>
</aside>
<main id="main"></main>
<nav class="bottom"><div class="wrap"><button data-act="tab" data-tab="latihan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Latihan</button><button data-act="tab" data-tab="atur"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M8 15h3"/></svg>Atur Jadwal</button><button data-act="tab" data-tab="pustaka"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></svg>Pustaka Gerakan</button></div></nav>

<script>
/* ============ KONFIGURASI ============ */
/* Satu tampilan untuk semua perangkat: layar >= 1024px pakai tata letak laptop, di bawahnya tata letak HP */
const MQ = window.matchMedia('(min-width: 1024px)');
let DESK = MQ.matches;
const REPO = 'https://raw.githubusercontent.com/hasaneyldrm/exercises-dataset/main/';
const DB_URL = REPO + 'data/exercises.json';
const K = {plan:'gp2_plan', db:'gp2_db', log:'gp2_log'};
const DAYS = ['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Minggu'];
const DAYS_S = ['Sen','Sel','Rab','Kam','Jum','Sab','Min'];
const TYPES = {
  gym:{ic:'🏋️',name:'Latihan gym',label:'Push, Pull, Legs, Upper…',desc:'mis. Pemanasan 10 menit treadmill, naikkan beban 2,5 kg kalau semua set lancar…'},
  activity:{ic:'🏃',name:'Aktivitas lain',label:'Lari, Renang, Futsal…',desc:'mis. Lari 5 km santai, pace ±6:30/km, lalu peregangan 10 menit'},
  rest:{ic:'😴',name:'Libur',label:'Libur',desc:'mis. Istirahat total / jalan santai 20 menit / foam rolling'}
};
const PRESETS = ['Lari','Jalan kaki','Bersepeda','Renang','Futsal','Badminton','Yoga / stretching','Kardio','Hiking'];

const MUSCLE_ID = {
  abs:'Perut', abductors:'Paha luar', adductors:'Paha dalam', biceps:'Bisep', calves:'Betis',
  'cardiovascular system':'Kardio', delts:'Bahu (deltoid)', forearms:'Lengan bawah', glutes:'Bokong',
  hamstrings:'Paha belakang', lats:'Punggung (lats)', 'levator scapulae':'Leher (levator scapulae)',
  pectorals:'Dada', 'pectoralis major':'Dada', chest:'Dada', 'upper chest':'Dada atas', quads:'Paha depan', quadriceps:'Paha depan',
  'serratus anterior':'Serratus (rusuk samping)', spine:'Punggung bawah', 'lower back':'Punggung bawah',
  traps:'Trapezius', trapezius:'Trapezius', triceps:'Trisep', 'upper back':'Punggung atas', back:'Punggung',
  'hip flexors':'Pinggul depan', shoulders:'Bahu', 'rear deltoids':'Bahu belakang', 'rotator cuff':'Rotator cuff',
  obliques:'Perut samping', core:'Core', 'lower abs':'Perut bawah', 'inner thighs':'Paha dalam', groin:'Selangkangan',
  wrists:'Pergelangan tangan', 'wrist flexors':'Fleksor pergelangan', 'wrist extensors':'Ekstensor pergelangan',
  ankles:'Pergelangan kaki', 'ankle stabilizers':'Stabilisator pergelangan kaki', soleus:'Betis (soleus)',
  brachialis:'Brachialis', sternocleidomastoid:'Leher', hands:'Tangan', feet:'Kaki', shins:'Tulang kering'
};
const BODY_ID = {
  back:'Punggung', cardio:'Kardio', chest:'Dada', 'lower arms':'Lengan bawah', 'lower legs':'Betis / kaki bawah',
  neck:'Leher', shoulders:'Bahu', 'upper arms':'Lengan atas', 'upper legs':'Paha', waist:'Perut / pinggang'
};
const EQUIP_ID = {
  assisted:'Dibantu (assisted)', band:'Band', barbell:'Barbel', 'body weight':'Tanpa alat', 'bosu ball':'Bosu ball',
  cable:'Kabel', dumbbell:'Dumbel', 'elliptical machine':'Mesin elliptical', 'ez barbell':'EZ bar', hammer:'Palu',
  kettlebell:'Kettlebell', 'leverage machine':'Mesin (lever)', 'medicine ball':'Medicine ball', 'olympic barbell':'Barbel olimpiade',
  'resistance band':'Resistance band', roller:'Roller', rope:'Tali', 'skierg machine':'Mesin SkiErg', 'sled machine':'Mesin sled',
  'smith machine':'Smith machine', 'stability ball':'Gym ball', 'stationary bike':'Sepeda statis', 'stepmill machine':'Mesin stepmill',
  tire:'Ban', 'trap bar':'Trap bar', 'upper body ergometer':'Ergometer tubuh atas', weighted:'Beban tambahan', 'wheel roller':'Ab roller', other:'Lainnya'
};

/* Nama Indonesia — dikunci ke nama gerakan di database, jadi selalu cocok dengan animasinya */
const ALIAS_RAW = {
  'barbell bench press':'Bench press barbel',
  'dumbbell incline bench press':'Incline press dumbel (dada atas)',
  'dumbbell seated shoulder press':'Shoulder press dumbel duduk',
  'dumbbell lateral raise':'Angkat samping (bahu samping)',
  'cable pushdown':'Pushdown trisep kabel',
  'triceps dip':'Dips trisep',
  'chest dip':'Dips dada',
  'pull-up':'Pull-up',
  'barbell bent over row':'Row barbel membungkuk',
  'cable seated row':'Row kabel duduk',
  'cable rear delt row (with rope)':'Face pull / row bahu belakang (tali)',
  'barbell curl':'Curl barbel (bisep)',
  'dumbbell hammer curl':'Hammer curl dumbel',
  'barbell full squat':'Squat barbel',
  'barbell romanian deadlift':'Romanian deadlift (paha belakang)',
  'sled 45° leg press':'Leg press 45°',
  'lever lying leg curl':'Leg curl tengkurap',
  'lever leg extension':'Leg extension (paha depan)',
  'lever standing calf raise':'Jinjit berdiri mesin (betis)',
  'barbell standing calf raise':'Jinjit berdiri barbel (betis)',
  'barbell deadlift':'Deadlift barbel',
  'cable pulldown':'Lat pulldown kabel',
  'dumbbell fly':'Fly dumbel',
  'push-up':'Push-up',
  'dumbbell biceps curl':'Curl dumbel (bisep)',
  'lever seated leg curl':'Leg curl duduk',
  '3/4 sit-up':'Sit-up 3/4'
};

/* Template PPL. ids = ID yang sudah dipastikan, names = nama-nama yang dicari di database */
const T = (ids,names,sets,reps,rest)=>({ids,names,sets,reps,rest});
const PUSH = [
  T(['0025'],['barbell bench press'],4,'8',120),
  T([],['dumbbell incline bench press','incline dumbbell press'],3,'10',90),
  T([],['dumbbell seated shoulder press','dumbbell shoulder press'],3,'10',90),
  T(['0334'],['dumbbell lateral raise'],3,'15',60),
  T([],['cable pushdown','cable triceps pushdown','cable pushdown (with rope attachment)'],3,'12',60),
  T([],['triceps dip','chest dip'],3,'10',90)
];
const PULL = [
  T(['0652'],['pull-up'],4,'8',120),
  T([],['barbell bent over row'],4,'8',120),
  T([],['cable seated row'],3,'12',90),
  T([],['cable rear delt row (with rope)','cable standing rear delt row (with rope)','face pull'],3,'15',60),
  T([],['barbell curl'],3,'10',60),
  T([],['dumbbell hammer curl','hammer curl'],3,'12',60)
];
const LEGS = [
  T(['0043'],['barbell full squat'],4,'8',150),
  T([],['barbell romanian deadlift','romanian deadlift'],3,'10',120),
  T([],['sled 45° leg press','sled 45 degrees leg press','leg press'],3,'12',90),
  T([],['lever lying leg curl'],3,'12',60),
  T([],['lever leg extension'],3,'12',60),
  T([],['lever standing calf raise','barbell standing calf raise'],4,'15',60)
];
const TEMPLATE = [
  {type:'gym',label:'Push',ex:PUSH},{type:'gym',label:'Pull',ex:PULL},{type:'gym',label:'Legs',ex:LEGS},
  {type:'gym',label:'Push',ex:PUSH},{type:'gym',label:'Pull',ex:PULL},{type:'gym',label:'Legs',ex:LEGS},
  {type:'activity',label:'Lari',desc:'Lari santai 20–30 menit (opsional), lalu peregangan 10 menit.',ex:[]}
];

/* ============ UTIL ============ */
const $ = s=>document.querySelector(s);
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s=>String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const cap = s=>String(s||'').replace(/(^|[\s(\/-])([a-z])/g,(m,a,b)=>a+b.toUpperCase());
const uid = ()=>Math.random().toString(36).slice(2,10);
const todayIdx = ()=>(new Date().getDay()+6)%7;
const dateKey = ()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const fmt = s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const lbl = (map,v)=>map[String(v||'').toLowerCase()]||cap(v||'');
const media = p=>!p?'':(/^https?:/.test(p)?p:REPO+String(p).replace(/^\/+/,''));
const ALIAS = Object.fromEntries(Object.entries(ALIAS_RAW).map(([k,v])=>[norm(k),v]));
const aliasOf = e=>e?ALIAS[e._n]||'':'';
const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
};
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),1800)}

/* ============ DATA ============ */
let DB=[], BYID=new Map(), dbState='load';
let log = store.get(K.log, {date:'',done:{}});
if(log.date!==dateKey()) log={date:dateKey(),done:{}};

const state = {
  tab:'latihan', day:todayIdx(), editDay:todayIdx(), sel:new Set(),
  lib:{q:'',bp:'',eq:'',limit:60}, side:{q:'',bp:'',eq:'',limit:40}, pick:null, lastDb:null
};

function newPlanFromTemplate(){
  return {days: TEMPLATE.map(d=>({
    type:d.type, label:d.label, desc:d.desc||'',
    ex:d.ex.map(t=>({uid:uid(), id:null, cand:{ids:t.ids,names:t.names}, name:cap(t.names[0]), sets:t.sets, reps:t.reps, rest:t.rest, note:''}))
  }))};
}
function normPlan(p){
  if(!p || !Array.isArray(p.days) || p.days.length!==7) return null;
  p.days.forEach(d=>{
    if(!TYPES[d.type]) d.type = d.rest ? 'rest' : 'gym';
    delete d.rest;
    d.label = d.label||''; d.desc = d.desc||'';
    d.ex = (Array.isArray(d.ex)?d.ex:[]).map(x=>({uid:x.uid||uid(),id:x.id||null,name:x.name||'',sets:x.sets||3,reps:x.reps||'10',rest:x.rest??90,note:x.note||'',...(x.cand?{cand:x.cand}:{})}));
  });
  return p;
}
let plan = normPlan(store.get(K.plan,null)) || newPlanFromTemplate();
function savePlan(){ if(!store.set(K.plan,plan)) toast('Gagal menyimpan (penyimpanan browser penuh/diblokir)'); }
function saveLog(){ store.set(K.log,log); }
const dayTitle = d => d.label || (d.type==='rest'?'Libur':d.type==='activity'?'Aktivitas':'Latihan');

function stepsOf(e){
  const st=e.instruction_steps && (e.instruction_steps.en||e.instruction_steps);
  if(Array.isArray(st) && st.length) return st.map(String);
  let t=e.instructions;
  if(t && typeof t==='object' && !Array.isArray(t)) t=t.en||'';
  if(Array.isArray(t)) return t.map(String);
  return String(t||'').split(/(?<=[.!?])\s+(?=[A-Z0-9])/).map(x=>x.trim()).filter(Boolean);
}
function slimDB(data){
  const arr=Array.isArray(data)?data:(data.exercises||data.data||[]);
  return arr.filter(e=>e&&e.id!=null&&e.name).map(e=>({
    id:String(e.id), name:String(e.name), bp:e.body_part||e.category||'', eq:e.equipment||'',
    target:e.target||'', sec:Array.isArray(e.secondary_muscles)?e.secondary_muscles:[],
    steps:stepsOf(e), img:e.image||'', gif:e.gif_url||''
  }));
}
function indexDB(list){
  DB=list; BYID=new Map(DB.map(e=>[e.id,e]));
  for(const e of DB){
    e._n=norm(e.name);
    const mus=[e.target,...e.sec];
    e._hay=norm([e.name, ALIAS[e._n]||'', mus.join(' '), mus.map(m=>MUSCLE_ID[String(m).toLowerCase()]||'').join(' '),
      e.bp, BODY_ID[String(e.bp).toLowerCase()]||'', e.eq, EQUIP_ID[String(e.eq).toLowerCase()]||''].join(' '));
  }
}

/* Cocokkan item template ke database: ID dulu, lalu nama persis, lalu nama paling mirip */
function resolveItem(c){
  for(const id of c.ids||[]) if(BYID.has(id)) return BYID.get(id);
  const names=(c.names||[]).map(norm);
  for(const n of names){ const e=DB.find(x=>x._n===n); if(e) return e; }
  let best=null,bs=0;
  for(const n of names){
    const qt=n.split(' ');
    for(const e of DB){
      const et=e._n.split(' ');
      const s=qt.filter(t=>et.includes(t)).length/Math.max(qt.length,et.length);
      if(s>bs){bs=s;best=e}
    }
  }
  return bs>=0.6?best:null;
}
function resolvePending(){
  let changed=false;
  for(const d of plan.days) for(const it of d.ex){
    if(it.cand){
      const e=resolveItem(it.cand);
      if(e){it.id=e.id; it.name=cap(e.name)}
      delete it.cand; changed=true;
    } else if(it.id && BYID.has(it.id)) it.name=cap(BYID.get(it.id).name);
  }
  if(changed) savePlan();
}

async function loadDB(force){
  setDbStat('load');
  if(!force){
    const cached=store.get(K.db,null);
    if(Array.isArray(cached) && cached.length>100){ indexDB(cached); resolvePending(); setDbStat('ok'); render(); return; }
  }
  try{
    const r=await fetch(DB_URL,{cache:'no-cache'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const slim=slimDB(await r.json());
    if(!slim.length) throw new Error('kosong');
    indexDB(slim); store.set(K.db,slim); resolvePending(); setDbStat('ok');
    if(force) toast('Database diperbarui: '+DB.length+' gerakan');
  }catch(err){
    console.error(err);
    if(!DB.length) setDbStat('err'); else { setDbStat('ok'); toast('Gagal memperbarui, memakai data tersimpan'); }
  }
  render();
}
function setDbStat(s){
  dbState=s;
  const html = s==='load' ? '<i class="dot load"></i><span>Memuat database…</span>'
    : s==='ok' ? '<i class="dot ok"></i><span>'+DB.length+' gerakan</span>'
    : '<i class="dot err"></i><span>Offline</span> <button class="btn sm" data-act="reloadDB">Coba lagi</button>';
  document.querySelectorAll('.dbstat').forEach(el=>el.innerHTML=html);
}

/* ============ KOMPONEN ============ */
const exOf = it=> it && it.id ? BYID.get(it.id) : null;
const exName = it=>{const e=exOf(it);return e?cap(e.name):it.name};
function mediaHTML(e,mode,cls=''){
  if(!e) return `<div class="media empty ${cls}"><span>${dbState==='load'?'Memuat…':dbState==='err'?'Animasi belum termuat':'Belum dipilih'}</span></div>`;
  const src = mode==='thumb' ? (e.img||e.gif) : (e.gif||e.img);
  if(!src) return `<div class="media empty ${cls}"><span>Tidak ada animasi</span></div>`;
  return `<div class="media ${cls}">${mode==='thumb'&&e.gif?'<span class="play">▶ animasi</span>':''}`+
    `<img loading="lazy" src="${esc(media(src))}" alt="Animasi ${esc(cap(e.name))}" onerror="this.parentNode.classList.add('err')"></div>`;
}
function muscleTags(e,full){
  if(!e) return '';
  let h=e.target?`<span class="tag p">${esc(lbl(MUSCLE_ID,e.target))}</span>`:'';
  if(full) h+=e.sec.filter(m=>String(m).toLowerCase()!==String(e.target).toLowerCase()).map(m=>`<span class="tag">${esc(lbl(MUSCLE_ID,m))}</span>`).join('');
  return h;
}
function dayChips(sel,act){
  return `<div class="days">`+plan.days.map((d,i)=>
    `<button class="chip-day t-${d.type} ${i===sel?'on':''} ${i===todayIdx()?'today':''}" data-act="${act}" data-d="${i}" title="${esc(DAYS[i]+' · '+dayTitle(d))}">
      ${DESK?DAYS[i]:DAYS_S[i]}<b>${d.type!=='gym'&&DESK?TYPES[d.type].ic+' ':''}${esc(dayTitle(d))}</b></button>`).join('')+`</div>`;
}
function nameBlock(e,it,missingMsg){
  const missing=!e && dbState==='ok';
  return `<div class="ex-name" ${e?`data-act="detail" data-id="${esc(e.id)}"`:''}>${esc(e?cap(e.name):it.name)}</div>
    ${aliasOf(e)?`<div class="ex-alias">${esc(aliasOf(e))}</div>`:''}
    ${missing?`<div class="ex-alias">${missingMsg}</div>`:''}`;
}
function dayOptions(selected){
  return plan.days.map((d,i)=>`<option value="${i}" ${i===selected?'selected':''}>${DAYS[i]} (${esc(dayTitle(d))})</option>`).join('');
}

/* ============ TAB: LATIHAN ============ */
function renderLatihan(){
  const i=state.day, d=plan.days[i];
  let h=dayChips(i,'day');
  h+=`<h2>${DAYS[i]} · ${esc(dayTitle(d))}</h2>`;
  if(d.type!=='gym'){
    const done=!!log.done['day'+i];
    h+=`<p class="sub">${TYPES[d.type].name}${i===todayIdx()?' · hari ini':''}</p>
      <div class="card daybig t-${d.type}">
        <div class="ic">${TYPES[d.type].ic}</div>
        <div class="grow"><div class="t">${esc(dayTitle(d))}</div>
          <div class="d ${d.desc?'':'empty'}">${d.desc?esc(d.desc):(d.type==='rest'?'Pemulihan juga bagian dari latihan.':'Belum ada keterangan. Isi di tab Atur Jadwal.')}</div></div>
        ${d.type==='activity'?`<button class="btn ${done?'done-ok':'primary'}" data-act="actDone">${done?'✓ Selesai':'Tandai selesai'}</button>`:''}
      </div>
      <button class="btn" data-act="tab" data-tab="atur">Atur hari ini</button>`;
    return h;
  }
  let total=0,done=0;
  d.ex.forEach(it=>{const n=+it.sets||0;total+=n;done+=(log.done[it.uid]||[]).slice(0,n).filter(Boolean).length});
  const pct= total?Math.round(done/total*100):0;
  h+=`<p class="sub">${d.ex.length} gerakan · ${done}/${total} set selesai${i===todayIdx()?'':' · (bukan hari ini)'}</p>`;
  h+=`<div class="progress"><i style="width:${pct}%"></i></div>`;
  if(d.desc) h+=`<div class="card desc-card"><span class="ic">📝</span><div>${esc(d.desc)}</div></div>`;
  if(!d.ex.length) return h+`<div class="card empty-state">Belum ada gerakan di hari ini.<br><br><button class="btn" data-act="tab" data-tab="atur">Atur jadwal</button></div>`;
  h+=`<div class="exlist">`;
  d.ex.forEach((it,k)=>{
    const e=exOf(it), n=+it.sets||0, ds=log.done[it.uid]||[];
    h+=`<div class="card ${!e&&dbState==='ok'?'warn':''}">
      <div class="ex-head" ${e?`data-act="detail" data-id="${esc(e.id)}"`:''}>
        ${mediaHTML(e,'gif')}
        <div class="ex-info">
          <div class="ex-num">Gerakan ${k+1}</div>
          ${nameBlock(e,it,'Gerakan ini belum ditemukan di database. Pilih ulang di tab Atur Jadwal.')}
          <div class="ex-meta"><b>${n} set × ${esc(it.reps)}</b> · istirahat ${fmt(+it.rest||0)}</div>
          <div class="tags">${muscleTags(e)}</div>
        </div>
      </div>
      ${it.note?`<div class="note">📝 ${esc(it.note)}</div>`:''}
      <div class="sets">${Array.from({length:n},(_,s)=>
        `<button class="set ${ds[s]?'done':''}" data-act="set" data-uid="${it.uid}" data-s="${s}">${ds[s]?'✓ ':''}Set ${s+1}</button>`).join('')}
      </div>
    </div>`;
  });
  h+=`</div>`;
  if(total && done===total) h+=`<div class="card empty-state" style="color:var(--ok);margin-top:12px">🎉 Semua set selesai. Mantap!</div>`;
  return h;
}

/* ============ TAB: ATUR JADWAL ============ */
function daySettingsHTML(i){
  const d=plan.days[i], ty=TYPES[d.type];
  return `<div class="card daycfg">
    <label class="f">Jenis hari · ${DAYS[i]}</label>
    <div class="seg">${Object.entries(TYPES).map(([k,v])=>`<button class="${d.type===k?'on':''}" data-act="dtype" data-t="${k}">${v.ic} ${v.name}</button>`).join('')}</div>
    <div class="cfg-grid">
      <div><label class="f">Nama hari</label><input type="text" data-f="label" value="${esc(d.label)}" placeholder="${esc(ty.label)}"></div>
      <div><label class="f">Salin isi dari hari lain</label>
        <select data-f="copyfrom"><option value="">— pilih hari —</option>
        ${plan.days.map((x,j)=>j===i?'':`<option value="${j}">${DAYS[j]} (${esc(dayTitle(x))})</option>`).join('')}</select></div>
    </div>
    ${d.type==='activity'?`<div class="presets">${PRESETS.map(p=>`<button class="tag-btn ${d.label===p?'on':''}" data-act="preset" data-p="${esc(p)}">${esc(p)}</button>`).join('')}</div>`:''}
    <label class="f" style="margin-top:12px">Keterangan ${d.type==='gym'?'(opsional, tampil di atas daftar gerakan)':''}</label>
    <textarea data-f="desc" rows="3" placeholder="${esc(ty.desc)}">${esc(d.desc)}</textarea>
  </div>`;
}
function cleanSel(d){ for(const u of [...state.sel]) if(!d.ex.some(x=>x.uid===u)) state.sel.delete(u); }
function selbarHTML(d){
  const nSel=state.sel.size, all=d.ex.length>0 && nSel===d.ex.length;
  return `<div class="selbar ${nSel?'active':''}">
    <label class="selbox"><input type="checkbox" data-selall ${all?'checked':''}> Pilih semua</label>

function optionsOf(field,map){
  const vals=[...new Set(DB.map(e=>String(e[field]||'').toLowerCase()).filter(Boolean))];
  return vals.map(v=>[v,lbl(map,v)]).sort((a,b)=>a[1].localeCompare(b[1],'id'));
}
function filtersHTML(prefix,f,wide){
  return `<div class="filters ${wide?'wide':''}">
    <input class="full" type="search" id="${prefix}Q" value="${esc(f.q)}" placeholder="Cari: bench, squat, dada, bisep, dumbel…" autocomplete="off">
    <select id="${prefix}B"><option value="">Semua bagian tubuh</option>${optionsOf('bp',BODY_ID).map(([v,l])=>`<option value="${esc(v)}" ${f.bp===v?'selected':''}>${esc(l)}</option>`).join('')}</select>
    <select id="${prefix}E"><option value="">Semua alat</option>${optionsOf('eq',EQUIP_ID).map(([v,l])=>`<option value="${esc(v)}" ${f.eq===v?'selected':''}>${esc(l)}</option>`).join('')}</select>
  </div>`;
}
function searchDB(f){
  const toks=norm(f.q).split(' ').filter(Boolean);
  let res=DB.filter(e=>{
    if(f.bp && String(e.bp).toLowerCase()!==f.bp) return false;
    if(f.eq && String(e.eq).toLowerCase()!==f.eq) return false;
    return toks.every(t=>e._hay.includes(t));
  });
  if(toks.length){
    const q=norm(f.q);
    const score=e=>(e._n===q?0:e._n.startsWith(q)?1:e._n.includes(q)?2:ALIAS[e._n]?3:4);
    res.sort((a,b)=>score(a)-score(b)||a.name.localeCompare(b.name));
  } else {
    res.sort((a,b)=>(ALIAS[a._n]?0:1)-(ALIAS[b._n]?0:1)||a.name.localeCompare(b.name));
  }
  return res;
}
function countHTML(n,f,scope){
  if(n===0 && (f.bp||f.eq)){
    const parts=[f.bp?('bagian tubuh “'+lbl(BODY_ID,f.bp)+'”'):'',f.eq?('alat “'+lbl(EQUIP_ID,f.eq)+'”'):''].filter(Boolean).join(' & ');
    return `<div class="count">Tidak ada hasil dengan filter ${esc(parts)}. <button class="btn sm" data-act="clearF" data-scope="${scope}">Hapus filter</button></div>`;
  }
  return `<div class="count">${n} gerakan</div>`;
}

/* ============ TIMER ISTIRAHAT ============ */
const timer={end:0,iv:null};
function startTimer(sec,name){
  if(!sec) return;
  timer.end=Date.now()+sec*1000;
  $('#tLbl').textContent='Istirahat · '+name;
  $('#timer').classList.remove('done'); $('#timer').classList.add('show');
  clearInterval(timer.iv); timer.iv=setInterval(tick,250); tick();
}
function tick(){
  const left=Math.max(0,Math.ceil((timer.end-Date.now())/1000));
  $('#tBig').textContent=fmt(left);
  if(left<=0){
    clearInterval(timer.iv); timer.iv=null;
    $('#timer').classList.add('done'); $('#tLbl').textContent='Waktu istirahat habis, lanjut set berikutnya 💪';
    beep(); try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
    setTimeout(()=>{ if(!timer.iv) $('#timer').classList.remove('show'); },5000);
  }
}
function beep(){
  try{
    const ac=new (window.AudioContext||window.webkitAudioContext)();
    [0,0.25].forEach(t=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;o.connect(g);g.connect(ac.destination);
      g.gain.setValueAtTime(.25,ac.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+t+.2);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+.21)});
  }catch(e){}
}

/* ============ RENDER UTAMA ============ */
/* render tertunda: dipakai setelah kolom teks selesai diedit, supaya klik berikutnya tidak "hilang" karena tampilan diganti */
let softT=null;
function softRender(){ clearTimeout(softT); softT=setTimeout(()=>{ softT=null; if(!document.activeElement || !document.activeElement.matches('input[type=text],input[type=number],textarea')) render(); },300); }
function render(){
  clearTimeout(softT);
  document.querySelectorAll('nav [data-act="tab"]').forEach(b=>b.classList.toggle('on',b.dataset.tab===state.tab));
  /* laptop: di Atur Jadwal hanya bagian kiri yang diperbarui, panel pustaka tidak di-reset */
  if(DESK && state.tab==='atur' && $('#editorPane') && state.lastDb===dbState){ refreshAturDesk(); return; }
  state.lastDb=dbState;
  let h = state.tab==='latihan'?renderLatihan()
        : state.tab==='atur'?(DESK?renderAturDesk():renderAturMobile())
        : renderPustaka();
  if(state.tab!=='pustaka' && dbState==='err') h=dbMsg()+h;
  h+=`<footer>Animasi gerakan: © Gym visual — <a href="https://gymvisual.com/" target="_blank" rel="noopener">gymvisual.com</a> ·
    Dataset: <a href="https://github.com/hasaneyldrm/exercises-dataset" target="_blank" rel="noopener">hasaneyldrm/exercises-dataset</a><br>Jadwal disimpan di perangkat/browser ini.</footer>`;
  $('#main').innerHTML=DESK?`<div class="wrap-d">${h}</div>`:h;
  if(state.tab==='pustaka') renderLibResults();
  if(state.tab==='atur' && DESK) renderSideResults();
}

/* ============ EVENT ============ */
const act = {
  tab:t=>{state.tab=t.dataset.tab; state.lastDb=null; render(); scrollTo(0,0);},
  day:t=>{state.day=+t.dataset.d; render();},
  eday:t=>{state.editDay=+t.dataset.d; state.sel.clear(); render();},
  detail:t=>openDetail(t.dataset.id,false),
  preview:t=>openDetail(t.dataset.id,true),
  pickThis:t=>applyPick(t.dataset.id),
  close:t=>closeModal(t.dataset.l),
  dtype:t=>{
    const d=plan.days[state.editDay], ty=t.dataset.t; if(d.type===ty) return;
    if(ty==='rest' && !d.label) d.label='Libur';
    if(ty!=='rest' && d.label==='Libur') d.label='';
    d.type=ty; state.sel.clear(); savePlan(); render();
    if(ty!=='gym' && d.ex.length) toast('Daftar gerakan tetap tersimpan, muncul lagi kalau diubah ke Latihan gym');
  },
  preset:t=>{ plan.days[state.editDay].label=t.dataset.p; savePlan(); render(); },
  actDone:()=>{ const k='day'+state.day; log.done[k]=!log.done[k]; saveLog(); render(); },
  set:t=>{
    const u=t.dataset.uid, s=+t.dataset.s;
    const arr=log.done[u]||(log.done[u]=[]);
    arr[s]=!arr[s]; saveLog();
    const it=plan.days[state.day].ex.find(x=>x.uid===u);
    if(arr[s] && it){
      const n=+it.sets||0, doneCount=arr.slice(0,n).filter(Boolean).length, e=exOf(it);
      startTimer(+it.rest||0, doneCount<n ? (e?cap(e.name):it.name) : 'lanjut gerakan berikutnya');
    }
    render();
  },
  up:t=>moveItem(t.dataset.uid,-1),
  down:t=>moveItem(t.dataset.uid,1),
  delSel:()=>{
    const d=plan.days[state.editDay], n=state.sel.size; if(!n) return;
    const names=d.ex.filter(x=>state.sel.has(x.uid)).map(x=>'• '+exName(x));
    if(!confirm(`Hapus ${n} gerakan dari ${DAYS[state.editDay]}?\n\n${names.slice(0,8).join('\n')}${names.length>8?'\n…':''}`)) return;
    d.ex=d.ex.filter(x=>!state.sel.has(x.uid));
    state.sel.forEach(u=>delete log.done[u]); saveLog();
    state.sel.clear(); savePlan(); render(); toast(n+' gerakan dihapus');
  },
  replace:t=>openPicker('replace',state.editDay,t.dataset.uid),
  add:()=>openPicker('add',state.editDay),
  quickAdd:t=>{
    const e=BYID.get(t.dataset.id), d=plan.days[state.editDay]; if(!e) return;
    ensureGym(d); d.ex.push(newItem(e)); savePlan(); render(); toast('Ditambahkan ke '+DAYS[state.editDay]+': '+cap(e.name));
  },
  addToDay:t=>{
    const e=BYID.get(t.dataset.id), di=+$('#addDaySel').value, d=plan.days[di];
    const changed=ensureGym(d); d.ex.push(newItem(e));
    savePlan(); closeModal(1); toast('Ditambahkan ke '+DAYS[di]+(changed?' (jenis hari diubah ke Latihan gym)':'')); render();
  },
  clearF:t=>{
    const sc=t.dataset.scope, f= sc==='lib'?state.lib : sc==='side'?state.side : (state.pick&&state.pick.f); if(!f) return;
    f.bp='';f.eq='';
    const b=$('#'+sc+'B'), e=$('#'+sc+'E'); if(b) b.value=''; if(e) e.value='';
    ({lib:renderLibResults,side:renderSideResults,pk:renderPickResults})[sc]();
  },
  libMore:()=>{state.lib.limit+=60; renderLibResults();},
  sideMore:()=>{state.side.limit+=40; renderSideResults();},
  pkMore:()=>{state.pick.f.limit+=60; renderPickResults();},
  timerAdd:()=>{ if(timer.iv) timer.end+=15000; else startTimer(15,'tambahan'); },
  timerSkip:()=>{ clearInterval(timer.iv); timer.iv=null; $('#timer').classList.remove('show'); },
  reloadDB:()=>loadDB(true),
  export:()=>{
    const blob=new Blob([JSON.stringify(plan,null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='jadwal-gym.json'; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  },
  import:()=>$('#importFile').click(),
  reset:()=>{
    if(!confirm('Reset semua jadwal ke template Push/Pull/Legs? Perubahan Anda akan hilang.')) return;
    plan=newPlanFromTemplate(); state.sel.clear(); if(DB.length) resolvePending(); savePlan(); state.lastDb=null; render(); toast('Jadwal direset');
  }
};
function moveItem(u,dir){
  const ex=plan.days[state.editDay].ex, i=ex.findIndex(x=>x.uid===u), j=i+dir;
  if(i<0||j<0||j>=ex.length) return;
  [ex[i],ex[j]]=[ex[j],ex[i]]; savePlan(); render();
}
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-act]'); if(!t || t.disabled) return;
  const fn=act[t.dataset.act]; if(fn){ ev.preventDefault(); ev.stopPropagation(); fn(t,ev); }
});
document.addEventListener('input',ev=>{
  const t=ev.target, id=t.id;
  if(id==='libQ'){ state.lib.q=t.value; state.lib.limit=60; renderLibResults(); }
  if(id==='sideQ'){ state.side.q=t.value; state.side.limit=40; renderSideResults(); }
  if(id==='pkQ' && state.pick){ state.pick.f.q=t.value; state.pick.f.limit=60; renderPickResults(); }
  if(t.dataset.f==='desc'){ plan.days[state.editDay].desc=t.value; savePlan(); }
});
document.addEventListener('change',ev=>{
  const t=ev.target, id=t.id;
  const filt={libB:[state.lib,'bp',renderLibResults],libE:[state.lib,'eq',renderLibResults],
    sideB:[state.side,'bp',renderSideResults],sideE:[state.side,'eq',renderSideResults]};
  if(filt[id]){ const [f,k,fn]=filt[id]; f[k]=t.value; f.limit=id.startsWith('side')?40:60; fn(); return; }
  if((id==='pkB'||id==='pkE') && state.pick){ state.pick.f[id==='pkB'?'bp':'eq']=t.value; state.pick.f.limit=60; renderPickResults(); return; }
  if(t.dataset.sel!==undefined){ t.checked?state.sel.add(t.dataset.sel):state.sel.delete(t.dataset.sel); render(); return; }
  if(t.hasAttribute('data-selall')){
    const d=plan.days[state.editDay];
    if(t.checked) d.ex.forEach(x=>state.sel.add(x.uid)); else state.sel.clear();
    render(); return;
  }
  if(id==='importFile'){
    const file=t.files[0]; if(!file) return;
    file.text().then(txt=>{
      const p=normPlan(JSON.parse(txt)); if(!p) throw new Error('format');
      plan=p; state.sel.clear(); if(DB.length) resolvePending(); savePlan(); state.lastDb=null; render(); toast('Jadwal diimpor');
    }).catch(()=>toast('File tidak valid')).finally(()=>{t.value=''});
    return;
  }
  const f=t.dataset.f; if(!f) return;
  const d=plan.days[state.editDay];
  if(f==='label'){ d.label=t.value.trim(); savePlan(); softRender(); return; }
  if(f==='desc'){ d.desc=t.value; savePlan(); softRender(); return; }
  if(f==='copyfrom'){
    const src=plan.days[+t.value]; if(!src) return;
    if((d.ex.length||d.desc) && !confirm('Isi '+DAYS[state.editDay]+' akan diganti dengan isi '+DAYS[+t.value]+'. Lanjut?')){ t.value=''; return; }
    d.type=src.type; d.label=src.label; d.desc=src.desc; d.ex=src.ex.map(x=>({...x,uid:uid()})); state.sel.clear();
    savePlan(); render(); toast('Disalin dari '+DAYS[+t.value]); return;
  }
  const it=d.ex.find(x=>x.uid===t.dataset.uid); if(!it) return;
  if(f==='sets') it.sets=Math.max(1,Math.min(12,parseInt(t.value)||1));
  if(f==='rest') it.rest=Math.max(0,parseInt(t.value)||0);
  if(f==='reps') it.reps=t.value.trim()||'10';
  if(f==='note') it.note=t.value.trim();
  savePlan();
  if(DESK && state.tab==='atur') softRender();
});
document.addEventListener('keydown',ev=>{ if(ev.key==='Escape'){ if($('#m2').classList.contains('open')) closeModal(2); else closeModal(1); }});

/* ganti tata letak otomatis saat ukuran jendela berubah (mis. HP diputar, jendela laptop diperkecil) */
const onMQ=e=>{ DESK=e.matches; state.lastDb=null; render(); };
if(MQ.addEventListener) MQ.addEventListener('change',onMQ); else MQ.addListener(onMQ);

/* ============ MULAI ============ */
render();
loadDB(false);

</script>
</body>
</html>
